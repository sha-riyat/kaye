[project]
name = "kaye"
version = "0.1.0"
description = "AI bookkeeping for West African merchants, entirely inside WhatsApp."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.122",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "modal>=1.6.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
